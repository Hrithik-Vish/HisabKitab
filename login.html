<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login – HisabKitab</title>
<link rel="stylesheet" href="assets/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="d-flex justify-content-center align-items-center vh-100">
<div class="card shadow p-4" style="width:330px;">
<div class="main-content">
    <img src="assets/img/logo.png" width="50"><h5 class="mt-2">HisabKitab</h5>
  </div>

  <input type="text" class="form-control mb-2" placeholder="Enter username" id="user">
  <input type="password" class="form-control mb-3" placeholder="Enter password" id="pass">
  <button class="btn btn-dark w-100" onclick="checkLogin()">Login</button>
</div>
</div>

<script>
function checkLogin(){
 if(user.value && pass.value){
   alert("Login Successful ✅");
   window.location="index.html";
 } else {
   alert("Enter details properly ❌");
 }
}
</script>

</body>
</html>
