<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>HisabKitab | Merchant Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/dashboard.css" rel="stylesheet">
</head>
<body>

  <div id="auth-screen" class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card p-5 shadow-lg" style="max-width: 400px; width: 100%;">
      <h3 class="text-center mb-4" style="color: var(--primary-dark); font-weight: 700;">🔐 HisabKitab</h3>
      <form id="loginForm">
        <input type="email" id="authEmail" class="form-control mb-3" placeholder="Email" required>
        <input type="password" id="authPassword" class="form-control mb-3" placeholder="Password" required>
        <button type="submit" class="btn btn-success w-100 mb-2 fw-bold">Login</button>
      </form>
    </div>
  </div>

  <div id="dashboard-screen" style="display: none;">
    <div id="sidebar" class="sidebar shadow">
      <h4 class="text-center text-white mt-3 mb-4 fw-bold">📊 HisabKitab</h4>
      <a href="#" class="nav-link active">🏠 Dashboard</a>
      <a href="#" class="nav-link">👥 Customers</a>
      <a href="#" class="nav-link">📦 Inventory</a>
      <a href="#" class="nav-link">🧾 Orders</a>
      <button id="logoutBtn" class="btn btn-danger w-100 mt-5 fw-bold">Logout</button>
    </div>

    <main class="main-content">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold" style="color: var(--primary-dark);">Shop Overview</h2>
        <div>
          <button class="btn btn-primary shadow-sm fw-bold" data-bs-toggle="modal" data-bs-target="#addCustomerModal">➕ Add Customer</button>
          <button class="btn btn-success shadow-sm fw-bold" data-bs-toggle="modal" data-bs-target="#addOrderModal">🛒 New Order</button>
        </div>
      </div>

      <div class="row g-4 mb-5">
        <div class="col-md-4">
          <div class="stat-card p-4">
            <p class="text-muted mb-1 fw-bold">Total Customers</p>
            <h2 id="statCustomers">0</h2>
          </div>
        </div>
        <div class="col-md-4">
          <div class="stat-card p-4">
            <p class="text-muted mb-1 fw-bold">Total Orders</p>
            <h2 id="statOrders">0</h2>
          </div>
        </div>
        <div class="col-md-4">
          <div class="stat-card p-4">
            <p class="text-muted mb-1 fw-bold">Total Pending Dues</p>
            <h2 id="statPending" class="text-danger">₹0</h2>
          </div>
        </div>
      </div>

      <div class="row g-4">
        <div class="col-md-8">
          <div class="stat-card p-4 h-100">
            <h5 class="mb-3 fw-bold" style="color: var(--primary-dark);">🛒 Recent Orders</h5>
            <div class="table-responsive">
              <table class="table table-hover align-middle">
                <thead class="table-light">
                  <tr>
                    <th>Customer</th>
                    <th>Description</th>
                    <th>Amount</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody id="ordersTableBody">
                  <tr><td colspan="4" class="text-center text-muted py-4">Loading orders...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <div class="col-md-4">
          <div class="stat-card p-4 h-100">
            <h5 class="mb-3 fw-bold" style="color: var(--primary-dark);">👥 Top Customers</h5>
            <div class="table-responsive">
              <table class="table table-hover align-middle">
                <thead class="table-light">
                  <tr>
                    <th>Name</th>
                    <th>Due</th>
                  </tr>
                </thead>
                <tbody id="customersTableBody">
                  <tr><td colspan="2" class="text-center text-muted py-4">Loading customers...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div class="modal fade" id="addCustomerModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold">Add New Customer</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="text" id="newCustName" class="form-control mb-3" placeholder="Full Name">
          <input type="text" id="newCustPhone" class="form-control mb-3" placeholder="Phone Number">
          <button id="saveCustomerBtn" class="btn btn-primary w-100 py-2 fw-bold">Save Customer</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="addOrderModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold">Create New Order</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <select id="orderCustomerSelect" class="form-select mb-3"><option value="">Select Customer...</option></select>
          <input type="text" id="orderDescription" class="form-control mb-3" placeholder="Description (e.g., Monthly Tiffin)">
          <input type="number" id="orderAmount" class="form-control mb-3" placeholder="Amount (₹)">
          <button id="saveOrderBtn" class="btn btn-success w-100 py-2 fw-bold">Create Order</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/api.js"></script>
</body>
</html>
