<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customers — HisabKitab</title>
<link href="assets/css/bootstrap.min.css" rel="stylesheet">
<link href="assets/css/dashboard.css" rel="stylesheet">
</head>
<body>

<div id="sidebar-container"></div>

<div class="main-content" style="margin-top:80px">
  <h3 class="mb-3">➕ Add Customer</h3>
  <div class="card shadow p-3 mb-4">
    <div class="row">
      <div class="col-md-6">
        <label>Name</label>
        <input type="text" id="custName" class="form-control">
      </div>
      <div class="col-md-6">
        <label>Phone (WhatsApp)</label>
        <input type="text" id="custPhone" class="form-control">
      </div>
    </div>
    <button class="btn btn-primary mt-3 w-100" id="addCustomerBtn">Add Customer</button>
  </div>

  <h4>📋 Customer List</h4>
  <table class="table table-bordered bg-white shadow-sm">
    <thead class="table-light">
      <tr><th>Name</th><th>Phone</th><th>Total Due</th></tr>
    </thead>
    <tbody id="customerList"><tr><td colspan="3" class="text-center">Loading...</td></tr></tbody>
  </table>
</div>

<script>
  const API_URL = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1" ? "http://localhost:5000/api" : "/api";
  const token = localStorage.getItem("token");
  if (!token) window.location.href = "index.html";

  async function loadCustomers() {
    try {
      const res = await fetch(`${API_URL}/customers`, { headers: { "Authorization": `Bearer ${token}` } });
      const customers = await res.json();
      let html = "";
      customers.forEach(c => {
        html += `<tr><td>${c.name}</td><td>${c.phone}</td><td class="text-danger fw-bold">₹${c.total_due || 0}</td></tr>`;
      });
      document.getElementById("customerList").innerHTML = html || '<tr><td colspan="3" class="text-center">No customers yet</td></tr>';
    } catch (err) { console.error(err); }
  }

  document.getElementById("addCustomerBtn").addEventListener("click", async () => {
    const name = document.getElementById("custName").value;
    const phone = document.getElementById("custPhone").value;
    if (!name || !phone) return alert("Fill all fields!");

    const res = await fetch(`${API_URL}/customers`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
      body: JSON.stringify({ name, phone })
    });
    if (res.ok) {
      document.getElementById("custName").value = "";
      document.getElementById("custPhone").value = "";
      loadCustomers();
    }
  });

  loadCustomers();
  fetch("components/sidebar.html").then(r=>r.text()).then(t=>document.getElementById("sidebar-container").innerHTML = t);
</script>
</body>
</html>
