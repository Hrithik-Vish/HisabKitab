<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HisabKitab — Pro Features</title>

<link rel="stylesheet" href="assets/css/bootstrap.min.css">
<link rel="stylesheet" href="assets/css/dashboard.css">

<style>
.pro-title {
  font-weight: 700;
  color: #d48b00;
  font-size: 22px;
  margin-bottom: 20px;
}

.feature-card {
  padding: 20px;
  border-radius: 14px;
  background: white;
  box-shadow: 0px 3px 12px rgba(0,0,0,0.08);
  transition: .2s ease;
}

.feature-card:hover {
  transform: translateY(-4px);
}

.feature-icon {
  font-size: 28px;
}

footer {
  text-align:center;
  padding: 25px;
  color:#666;
  margin-top: 60px;
  font-size:14px;
}
</style>
</head>
<body>

<!-- SIDEBAR -->
<div id="sidebar-container"></div>

<!-- MAIN CONTENT -->
<main class="main-content container">

  <h3 class="mb-4">Welcome to HisabKitab 👋</h3>

  <h4 class="pro-title">⭐ Premium Tools (UI Preview)</h4>

  <div class="row g-4">

    <div class="col-md-4">
      <div class="feature-card">
        <div class="feature-icon">📊</div>
        <h5 class="mt-2">AI Sales Insights</h5>
        <p>Trends, demand predictions</p>
      </div>
    </div>

    <div class="col-md-4">
      <div class="feature-card">
        <div class="feature-icon">🖼️</div>
        <h5 class="mt-2">Marketing Posters</h5>
        <p>Auto-generate social posters</p>
      </div>
    </div>

    <div class="col-md-4">
      <div class="feature-card">
        <div class="feature-icon">🏦</div>
        <h5 class="mt-2">Loan Score</h5>
        <p>Credit eligibility indicator</p>
      </div>
    </div>

  </div>

  <footer>
    Made with ❤️ for micro-entrepreneurs | HisabKitab © 2025
  </footer>

</main>

<!-- LOAD SIDEBAR -->
<script>
fetch("components/sidebar.html")
  .then(r => r.text())
  .then(html => {
      document.getElementById("sidebar-container").innerHTML = html;
  });
</script>

</body>
</html>
