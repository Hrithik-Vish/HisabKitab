<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Orders — HisabKitab</title>
<link href="assets/css/bootstrap.min.css" rel="stylesheet">
<link href="assets/css/dashboard.css" rel="stylesheet">
</head>
<body>

<div id="sidebar-container"></div>

<main class="main-content container mt-5">
  <div class="row g-4">
    <div class="col-md-4">
      <h3 class="mb-3">🧾 Add Order</h3>
      <div class="card shadow p-3 mb-3">
        <label class="form-label">Select Customer</label>
        <select id="orderCustomerSelect" class="form-select mb-3">
            <option value="">Loading customers...</option>
        </select>

        <label class="form-label">Description / Item</label>
        <input id="orderDescription" class="form-control mb-3" placeholder="e.g., Monthly Tiffin">

        <label class="form-label">Amount (₹)</label>
        <input type="number" id="orderAmount" class="form-control mb-3" placeholder="0">

        <button id="addBtn" class="btn btn-success w-100 fw-bold">Add Order</button>
      </div>
    </div>

    <div class="col-md-8">
      <h3 class="mb-3">📋 Recent Orders</h3>
      <div class="card shadow p-3">
        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead class="table-light">
              <tr>
                <th>Customer</th>
                <th>Item</th>
                <th>Amount</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="orderTable">
              <tr><td colspan="4" class="text-center text-muted">Loading orders...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</main>

<script>
  const API_URL = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1" ? "http://localhost:5000/api" : "/api";
  const token = localStorage.getItem("token");
  if (!token) window.location.href = "index.html";

  async function loadData() {
    try {
      // 1. Load Customers for dropdown
      const custRes = await fetch(`${API_URL}/customers`, { headers: { "Authorization": `Bearer ${token}` }});
      const customers = await custRes.json();
      let selectHtml = '<option value="">Select Customer...</option>';
      customers.forEach(c => selectHtml += `<option value="${c.id}">${c.name}</option>`);
      document.getElementById("orderCustomerSelect").innerHTML = selectHtml;

      // 2. Load Orders for table
      const orderRes = await fetch(`${API_URL}/orders`, { headers: { "Authorization": `Bearer ${token}` }});
      const orders = await orderRes.json();
      let orderHtml = "";
      orders.forEach(o => {
        const badgeClass = o.status === 'paid' ? 'bg-success' : 'bg-warning text-dark';
        orderHtml += `<tr>
          <td><strong>${o.customers?.name || 'Unknown'}</strong></td>
          <td class="text-muted">${o.description || '-'}</td>
          <td class="fw-bold">₹${o.amount}</td>
          <td><span class="badge ${badgeClass}">${(o.status || 'pending').toUpperCase()}</span></td>
        </tr>`;
      });
      document.getElementById("orderTable").innerHTML = orderHtml || '<tr><td colspan="4" class="text-center text-muted">No orders yet</td></tr>';
    } catch (err) { console.error(err); }
  }

  document.getElementById("addBtn").addEventListener("click", async () => {
    const customer_id = document.getElementById("orderCustomerSelect").value;
    const description = document.getElementById("orderDescription").value;
    const amount = document.getElementById("orderAmount").value;

    if (!customer_id || !amount) return alert("Select customer and enter amount!");

    const res = await fetch(`${API_URL}/orders`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
      body: JSON.stringify({ customer_id, description, amount })
    });

    if (res.ok) {
      document.getElementById("orderDescription").value = "";
      document.getElementById("orderAmount").value = "";
      loadData();
    }
  });

  loadData();
  fetch("components/sidebar.html").then(r=>r.text()).then(t=>document.getElementById("sidebar-container").innerHTML = t);
</script>
</body>
</html>
