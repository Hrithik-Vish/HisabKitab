<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>HisabKitab — Analytics (Charts)</title>

<link href="assets/css/bootstrap.min.css" rel="stylesheet">
<link href="assets/css/dashboard.css" rel="stylesheet">

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
  .earn-profit { color:#17803d; font-weight:700; display:inline-flex; align-items:center; gap:8px; }
  .earn-loss   { color:#c62828; font-weight:700; display:inline-flex; align-items:center; gap:8px; }
  .earn-zero   { color:#455a64; font-weight:700; display:inline-flex; align-items:center; gap:8px; }

  .pro-lock { position:relative; border-radius:8px; overflow:hidden; }
  .pro-lock .lock-overlay { position:absolute; inset:0; background: rgba(255,255,255,0.8); display:flex; align-items:center; justify-content:center; flex-direction:column; gap:10px; text-align:center; padding:18px; }
  .pro-badge { background: linear-gradient(90deg,#f6c84a,#f08a24); color:#fff; padding:6px 10px; border-radius:6px; font-weight:700; }
  .btn-unlock { background: #1b6f4a; color:#fff; border:0; padding:8px 12px; border-radius:8px; font-weight:700; }
  .chart-card { min-height:180px; }
</style>
</head>
<body>

<!-- Sidebar -->
<div id="sidebar-container"></div>

<main class="main-content container">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <h3>📈 Analytics & Charts</h3>
    <div>
      <button class="btn btn-outline-secondary" onclick="location.href='index.html'">← Back to Dashboard</button>
      <button class="btn btn-ghost" onclick="localStorage.setItem('isPro','1'); renderProState(); renderAllCharts();">Simulate Unlock Pro</button>
    </div>
  </div>

  <hr>

  <!-- Charts row 1 -->
  <div class="row">
    <div class="col-md-6">
      <div class="card p-3 chart-card">
        <h5>Today — Hourly Earnings (last 24h) <small class="text-muted-small">Free</small></h5>
        <canvas id="dailyChart" height="140"></canvas>
      </div>
    </div>

    <div class="col-md-6">
      <div class="card p-3 chart-card pro-lock" id="weeklyCard">
        <h5>Weekly — Last 7 Days</h5>
        <canvas id="weeklyChart" height="140"></canvas>
        <div class="lock-overlay" id="weeklyOverlay" style="display:none;">
          <div class="pro-badge">PRO</div>
          <h5>Weekly charts are part of Pro</h5>
          <div class="text-muted-small">Unlock analytics to view trends over the past 7 days.</div>
          <button class="btn-unlock" onclick="unlockPro()">Unlock Pro</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Charts row 2 -->
  <div class="row mt-3">
    <div class="col-md-12">
      <div class="card p-3 chart-card pro-lock" id="monthlyCard">
        <div style="display:flex;align-items:center;justify-content:space-between">
          <h5>Monthly — Last 30 Days</h5>
          <small class="text-muted-small">Pro</small>
        </div>
        <canvas id="monthlyChart" height="140"></canvas>
        <div class="lock-overlay" id="monthlyOverlay" style="display:none;">
          <div class="pro-badge">PRO</div>
          <h5>Monthly charts are part of Pro</h5>
          <div class="text-muted-small">Unlock analytics to view trends over the past 30 days.</div>
          <button class="btn-unlock" onclick="unlockPro()">Unlock Pro</button>
        </div>
      </div>
    </div>
  </div>

</main>

<script>
/* Storage helpers */
function safeParse(key,fallback){ try{ const r=localStorage.getItem(key); if(!r) return fallback; return JSON.parse(r)||fallback;}catch(e){return fallback;} }
function safeSet(k,v){ localStorage.setItem(k,JSON.stringify(v)); }

/* Ensure keys exist */
if(!localStorage.getItem('stats')) safeSet('stats',{customers:0,orders:0,earnings:0});
safeParse('orders',[]);
safeParse('customers',[]);
safeParse('pending',[]);

/* PRO utils */
function isPro(){ return localStorage.getItem('isPro') === '1'; }
function unlockPro(){ if(confirm("Unlock Pro features (demo)?")){ localStorage.setItem('isPro','1'); renderProState(); renderAllCharts(); alert('Pro unlocked (demo).'); } }

/* Chart helpers (same logic as before) */
let dailyChart=null, weeklyChart=null, monthlyChart=null;

function computeHourly24(){
  const orders = safeParse('orders',[]);
  const now = new Date();
  const hourly = new Array(24).fill(0);
  orders.forEach(o=>{
    if(!o.ts) return;
    const t = new Date(o.ts);
    const diffHours = Math.floor((now - t) / (1000*60*60));
    if(diffHours >= 0 && diffHours < 24){
      const idx = 23 - diffHours;
      hourly[idx] += Number(o.amount || 0);
    }
  });
  const labels = [];
  for(let i=23;i>=0;i--){
    const d = new Date(); d.setHours(d.getHours() - i);
    labels.push(d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}));
  }
  return {labels, values: hourly};
}

function computeDailyNDays(n){
  const orders = safeParse('orders',[]);
  const map = {};
  for(let i=0;i<n;i++){
    const d = new Date(); d.setDate(d.getDate()-i);
    const key = d.toISOString().slice(0,10);
    map[key] = 0;
  }
  orders.forEach(o=>{
    if(!o.ts) return;
    const key = new Date(o.ts).toISOString().slice(0,10);
    if(map[key] !== undefined) map[key] += Number(o.amount || 0);
  });
  return map;
}

/* Render functions */
function renderDailyChart(){
  const data = computeHourly24();
  const ctx = document.getElementById('dailyChart').getContext('2d');
  if(dailyChart) dailyChart.destroy();
  dailyChart = new Chart(ctx,{
    type:'line',
    data:{ labels:data.labels, datasets:[{label:'Hourly earnings (₹)', data:data.values, fill:true, tension:0.25, borderWidth:2}] },
    options:{ plugins:{legend:{display:false}}, scales:{ y:{ beginAtZero:true } } }
  });
}

function renderWeeklyChartIfPro(){
  const overlay = document.getElementById('weeklyOverlay');
  if(!isPro()){ overlay.style.display='flex'; if(weeklyChart){ weeklyChart.destroy(); weeklyChart=null; } return; }
  overlay.style.display='none';
  const map = computeDailyNDays(7);
  const labels = Object.keys(map).reverse(); const values = Object.values(map).reverse();
  const ctx = document.getElementById('weeklyChart').getContext('2d');
  if(weeklyChart) weeklyChart.destroy();
  weeklyChart = new Chart(ctx,{ type:'bar', data:{labels, datasets:[{label:'Earnings (₹)', data:values, borderWidth:1}] }, options:{ plugins:{legend:{display:false}}, scales:{ y:{ beginAtZero:true } } } });
}

function renderMonthlyChartIfPro(){
  const overlay = document.getElementById('monthlyOverlay');
  if(!isPro()){ overlay.style.display='flex'; if(monthlyChart){ monthlyChart.destroy(); monthlyChart=null; } return; }
  overlay.style.display='none';
  const map = computeDailyNDays(30);
  const labels = Object.keys(map).reverse(); const values = Object.values(map).reverse();
  const ctx = document.getElementById('monthlyChart').getContext('2d');
  if(monthlyChart) monthlyChart.destroy();
  monthlyChart = new Chart(ctx,{ type:'line', data:{ labels, datasets:[{label:'Earnings (₹)', data:values, borderWidth:2, tension:0.25}] }, options:{ plugins:{legend:{display:false}}, scales:{ y:{ beginAtZero:true } } } });
}

function renderProState(){
  document.getElementById('weeklyOverlay').style.display = isPro() ? 'none' : 'flex';
  document.getElementById('monthlyOverlay').style.display = isPro() ? 'none' : 'flex';
}

/* Master render */
function renderAllCharts(){
  renderDailyChart();
  renderWeeklyChartIfPro();
  renderMonthlyChartIfPro();
}

/* Init */
renderProState();
renderAllCharts();

/* live updates across tabs */
window.addEventListener('storage', (e)=>{
  if(['orders','isPro'].includes(e.key)) { renderProState(); renderAllCharts(); }
});

/* Sidebar */
fetch('components/sidebar.html').then(r=>r.text()).then(html=>document.getElementById('sidebar-container').innerHTML=html);

</script>
</body>
</html>
